[project]
name = "text-to-telegram"
version = "0.1.0"
description = "Telegram bot that bridges messages to/from text files"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.0",
]

[project.scripts]
text-to-telegram = "text_to_telegram.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_telegram"]
